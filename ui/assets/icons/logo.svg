<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512"
    width="100%"
    height="100%"
>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16171d" />
      <stop offset="100%" stop-color="#0b0c0f" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff948a" />
      <stop offset="55%" stop-color="#fe7971" />
      <stop offset="100%" stop-color="#e85850" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fe7971" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#fe7971" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fe7971" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#fe7971" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#fe7971" stop-opacity="0.08" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fe7971" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fe7971" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow
                dx="0"
                dy="10"
                stdDeviation="16"
                flood-color="#fe7971"
                flood-opacity="0.35"
            />
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect
        x="1.5"
        y="1.5"
        width="509"
        height="509"
        rx="114.5"
        fill="none"
        stroke="url(#borderGrad)"
        stroke-width="3"
    />
  <circle
        cx="256"
        cy="256"
        r="185"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.025"
        stroke-width="1.5"
    />
  <circle
        cx="256"
        cy="256"
        r="145"
        fill="none"
        stroke="#fe7971"
        stroke-opacity="0.06"
        stroke-width="1.5"
        stroke-dasharray="4 6"
    />
  <circle cx="280" cy="256" r="140" fill="url(#glowGrad)" />
  <g id="brand-mark">
    <rect
            x="135"
            y="224"
            width="22"
            height="64"
            rx="11"
            fill="url(#barGrad1)"
        />
    <rect
            x="185"
            y="196"
            width="22"
            height="120"
            rx="11"
            fill="url(#barGrad2)"
        />
    <path
            d="M 246 196
            Q 246 168, 269 184
            L 349 238
            Q 376 256, 349 274
            L 269 328
            Q 246 344, 246 316
            Z"
            fill="url(#accentGrad)"
            filter="url(#softShadow)"
        />
  </g>
</svg>
